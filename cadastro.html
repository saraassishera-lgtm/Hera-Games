<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Hera Games</title>
</head>
<body>
    <header>
        <h2>Formulário de Cadastro</h2>
        <nav>
            <ul>
                <li><a href="HeraGames.html">Voltar para a Página Inicial</a></li>
            </ul>
        </nav>
    </header>
    <hr>
    <main>
        <section>
            <p>Preencha os dados abaixo para se inscrever nos campeonatos de eSports.</p>
            <form>
                <p>
         
                    <label for="campo-nome">Nome Completo:</label>
                    <input type="text" id="campo-nome">
                </p>
                <p>
                    <label for="campo-cpf">CPF:</label>
                    <input type="text" id="campo-cpf">
                </p>
                <p>
                    <label for="campo-email">E-mail:</label>
                    <input type="email" id="campo-email">
                </p>
                <p>
                    <label for="campo-rua">Endereço — Rua:</label>
                    <input type="text" id="campo-rua">
                </p>
                <p>
                    <label for="campo-cidade">Endereço — Cidade:</label>
                    <input type="text" id="campo-cidade">
                </p>
                <p>
                    <label for="campo-estado">Endereço — Estado:</label>
                    <input type="text" id="campo-estado">
                </p>
                <p>
                    <label for="campo-pais">Endereço — País:</label>
                    <input type="text" id="campo-pais">
                </p>
                <p>
                    <label for="campo-senha">Senha:</label>
                    <input type="password" id="campo-senha">
                </p>
                <p>
                    <button type="submit">Concluir Cadastro</button>
                </p>
            </form>
        </section>
    </main>
    <hr>
    <footer>
        <p><em><strong>&copy; 2026 Hera Games. Todos os direitos reservados.</strong></em></p>
    </footer>
</body>
</html>
